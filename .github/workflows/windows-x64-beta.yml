name: Windows x64 Beta
run-name: ${{ github.workflow }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-x64-beta.yml"
      - "app/**"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npx vite build

      - name: Check Rust application
        working-directory: app/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Compile Rust tests
        working-directory: app/src-tauri
        run: cargo test --no-run

      - name: Verify Rust test manifest
        shell: pwsh
        run: |
          $testExecutables = Get-ChildItem "src-tauri/target/debug/deps/app_lib-*.exe"
          if (-not $testExecutables) {
            throw "No app_lib Rust test executable was produced."
          }

          $mt = Get-Command mt.exe -ErrorAction SilentlyContinue
          if (-not $mt) {
            $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            $mt = Get-ChildItem -Path $sdkBin -Filter mt.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $mt) {
            throw "Windows SDK mt.exe was not found."
          }
          $mtPath = if ($mt.Path) { $mt.Path } else { $mt.FullName }

          foreach ($testExe in $testExecutables) {
            $manifest = Join-Path $env:RUNNER_TEMP "$($testExe.BaseName).manifest"
            & $mtPath "-inputresource:$($testExe.FullName);#1" "-out:$manifest"
            if ($LASTEXITCODE -ne 0) {
              throw "mt.exe could not extract the manifest from $($testExe.FullName)."
            }
            $contents = Get-Content $manifest -Raw
            if ($contents -notmatch 'Microsoft.Windows.Common-Controls' -or $contents -notmatch 'version="6\.0\.0\.0"') {
              throw "Common Controls v6 is absent from $($testExe.FullName)."
            }
          }

      - name: Test Rust application
        id: cargo_test
        working-directory: app/src-tauri
        run: cargo test

      - name: Diagnose failed Rust test executable
        if: failure()
        shell: pwsh
        run: |
          $testExecutables = Get-ChildItem "src-tauri/target/debug/deps/app_lib-*.exe" -ErrorAction SilentlyContinue
          if (-not $testExecutables) {
            Write-Host "No app_lib test executable is available for dumpbin diagnostics."
            exit 0
          }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin -and $env:VSINSTALLDIR) {
            $dumpbin = Get-ChildItem -Path $env:VSINSTALLDIR -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
              Select-Object -First 1
          }
          if (-not $dumpbin) {
            Write-Host "dumpbin.exe was not found for diagnostics."
            exit 0
          }
          $dumpbinPath = if ($dumpbin.Path) { $dumpbin.Path } else { $dumpbin.FullName }
          foreach ($testExe in $testExecutables) {
            Write-Host "--- DEPENDENTS: $($testExe.FullName) ---"
            & $dumpbinPath /DEPENDENTS $testExe.FullName
            Write-Host "--- IMPORTS: $($testExe.FullName) ---"
            & $dumpbinPath /IMPORTS $testExe.FullName
          }

      - name: Build NSIS installer
        run: npx tauri build --config src-tauri/tauri.windows.conf.json --target x86_64-pc-windows-msvc

      - name: Discover and normalize NSIS installer
        id: installer
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundleDir -Filter "CowPaper_*-x64-setup.exe" -File -ErrorAction SilentlyContinue)

          if ($installers.Count -ne 1) {
            $found = if ($installers.Count) { $installers.FullName -join ", " } else { "none" }
            throw "Expected exactly one CowPaper NSIS installer in $bundleDir; found $($installers.Count): $found"
          }

          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $releaseName = "CowPaper_$version`_x64-setup.exe"
          $releaseInstaller = Join-Path $bundleDir $releaseName
          if ($installers[0].FullName -ne [System.IO.Path]::GetFullPath($releaseInstaller)) {
            Move-Item -Path $installers[0].FullName -Destination $releaseInstaller -Force
          }

          "installer=$releaseInstaller" >> $env:GITHUB_OUTPUT
          "artifact_name=$([System.IO.Path]::GetFileNameWithoutExtension($releaseName))" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.artifact_name }}
          path: app/${{ steps.installer.outputs.installer }}
          if-no-files-found: error
