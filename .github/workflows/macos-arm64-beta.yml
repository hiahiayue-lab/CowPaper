name: macOS arm64 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/macos-arm64-beta.yml"
      - "app/**"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust stable arm64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npx vite build

      - name: Check Rust application
        working-directory: app/src-tauri
        run: cargo check --target aarch64-apple-darwin

      - name: Test Rust application
        working-directory: app/src-tauri
        run: cargo test --target aarch64-apple-darwin

      - name: Build macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path="$bundle_dir/macos/CowPaper.app"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          dmg_path="$bundle_dir/dmg/CowPaper_${version}_aarch64.dmg"

          set +e
          npx tauri build --target aarch64-apple-darwin
          tauri_status=$?
          set -e

          if [[ $tauri_status -ne 0 ]]; then
            if [[ ! -d "$app_path" ]]; then
              exit $tauri_status
            fi
            echo "Tauri's Finder-based DMG step failed; the verified app bundle will be packaged headlessly below."
          fi

          test -d "$app_path"
          # The beta channel deliberately uses an ad-hoc signature. Re-sign the
          # just-built bundle before packaging so CodeResources is current.
          codesign --force --deep --sign - "$app_path"

          # Package the verified bundle in a standard installable layout. Do
          # not use the app bundle itself as srcfolder: doing so drops the
          # Applications symlink from the final DMG.
          rm -f "$dmg_path"
          mkdir -p "$(dirname "$dmg_path")"
          staging_dir="$(mktemp -d)"
          trap 'rm -rf "$staging_dir"' EXIT
          cp -R "$app_path" "$staging_dir/CowPaper.app"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create -volname CowPaper -srcfolder "$staging_dir" -ov -format UDZO "$dmg_path"
          test -f "$dmg_path"

      - name: Verify app signature and architecture
        run: |
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/CowPaper.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          file "$app_path/Contents/MacOS/app" | grep -q "arm64"

      - name: Discover and normalize macOS DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg_dir="$bundle_dir/dmg"
          dmg_paths=()
          while IFS= read -r dmg_path; do
            dmg_paths+=("$dmg_path")
          done < <(find "$dmg_dir" -maxdepth 1 -type f -name 'CowPaper_*.dmg' -print)

          if [[ ${#dmg_paths[@]} -ne 1 ]]; then
            found="none"
            if [[ ${#dmg_paths[@]} -gt 0 ]]; then found="${dmg_paths[*]}"; fi
            echo "Expected exactly one CowPaper DMG in $dmg_dir; found ${#dmg_paths[@]}: $found" >&2
            exit 1
          fi

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          release_name="CowPaper_${version}_aarch64.dmg"
          release_dmg="$dmg_dir/$release_name"
          if [[ "${dmg_paths[0]}" != "$release_dmg" ]]; then
            mv "${dmg_paths[0]}" "$release_dmg"
          fi

          printf 'dmg_path=%s\n' "$release_dmg" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "${release_name%.dmg}" >> "$GITHUB_OUTPUT"

      - name: Verify DMG layout and print SHA-256
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          set -euo pipefail
          dmg_path="$DMG_PATH"
          test -f "$dmg_path"
          mount_dir="$(mktemp -d)"
          attached=0
          cleanup() {
            if [[ $attached -eq 1 ]]; then hdiutil detach "$mount_dir" -quiet; fi
            rmdir "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          attached=1
          test -d "$mount_dir/CowPaper.app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          shasum -a 256 "$dmg_path"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.artifact_name }}
          path: app/${{ steps.dmg.outputs.dmg_path }}
          if-no-files-found: error
