name: Signed Updater Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation (requires dispatch from the version tag)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: updater-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Type check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npx vite build
      - name: Check Rust application
        working-directory: app/src-tauri
        run: cargo check --target aarch64-apple-darwin
      - name: Test Rust application
        working-directory: app/src-tauri
        run: cargo test --target aarch64-apple-darwin
      - name: Build Tauri app and updater source
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app
      - name: Sign and verify zero-cost macOS distribution
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app="$bundle/macos/CowPaper.app"
          test -d "$app"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"

          # Tauri's linker/adhoc signature covers only the executable. Sign
          # every nested Mach-O from the inside out, then sign the app bundle
          # itself so codesign creates Contents/_CodeSignature/CodeResources.
          python3 - "$app" <<'PY'
          import pathlib
          import subprocess
          import sys

          app = pathlib.Path(sys.argv[1])
          nested = []
          for path in app.joinpath('Contents').rglob('*'):
              if path.is_file():
                  result = subprocess.run(['file', '-b', str(path)], capture_output=True, text=True)
                  if 'Mach-O' in result.stdout:
                      nested.append(path)
              elif path.is_dir() and path.suffix in {'.framework', '.app', '.xpc'}:
                  nested.append(path)
          for path in sorted(set(nested), key=lambda item: len(item.parts), reverse=True):
              subprocess.run([
                  'codesign', '--force', '--sign', '-', '--timestamp=none', str(path),
              ], check=True)
          subprocess.run([
              'codesign', '--force', '--deep', '--sign', '-', '--timestamp=none', str(app),
          ], check=True)
          PY

          signature_info="$(codesign -dvvv "$app" 2>&1)"
          [[ "$signature_info" == *"Signature=adhoc"* ]]
          [[ "$signature_info" == *"Sealed Resources="* ]]
          [[ "$signature_info" != *"Sealed Resources=none"* ]]
          [[ "$signature_info" != *"Info.plist=not bound"* ]]
          test -d "$app/Contents/Resources"
          test -f "$app/Contents/_CodeSignature/CodeResources"
          file "$app/Contents/MacOS/app" | grep -q arm64
          codesign --verify --deep --strict --verbose=4 "$app"

          app_cdhash="$(printf '%s\n' "$signature_info" | awk -F= '/^CDHash=/{print $2}')"
          test -n "$app_cdhash"

          # Prove the resource seal is real using only a disposable copy.
          tampered="$(mktemp -d)"
          cp -R "$app" "$tampered/CowPaper.app"
          python3 - "$tampered/CowPaper.app/Contents/Resources/icon.icns" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          data[0] ^= 1
          path.write_bytes(data)
          PY
          if codesign --verify --deep --strict --verbose=4 "$tampered/CowPaper.app"; then
            echo "Resource tamper unexpectedly passed codesign" >&2
            exit 1
          fi

          # Tauri generated this archive before the bundle was re-signed. Do
          # not reuse it: rebuild the exact Tauri top-level app layout from
          # the fully signed app, then apply the existing Tauri minisign key.
          updater="$bundle/macos/CowPaper.app.tar.gz"
          rm -f "$updater" "$updater.sig"
          tar -czf "$updater" -C "$bundle/macos" CowPaper.app
          npx tauri signer sign "$updater"
          test -s "$updater.sig"

          updater_extract="$(mktemp -d)"
          tar -xzf "$updater" -C "$updater_extract"
          codesign --verify --deep --strict --verbose=4 "$updater_extract/CowPaper.app"
          updater_cdhash="$(codesign -dv "$updater_extract/CowPaper.app" 2>&1 | awk -F= '/^CDHash=/{print $2}')"
          test "$updater_cdhash" = "$app_cdhash"

          brew list --versions minisign >/dev/null 2>&1 || brew install minisign
          python3 - "$RUNNER_TEMP/cowpaper-updater.pub" <<'PY'
          import base64
          import json
          import pathlib
          import sys
          config = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(config['plugins']['updater']['pubkey']))
          PY
          minisign -Vm "$updater" -p "$RUNNER_TEMP/cowpaper-updater.pub" -x "$updater.sig"

          staging="$(mktemp -d)"
          cp -R "$app" "$staging/CowPaper.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$bundle/dmg"
          dmg="$bundle/dmg/CowPaper_${version}_aarch64.dmg"
          hdiutil create -volname CowPaper -srcfolder "$staging" -ov -format UDZO "$dmg"

          mount_dir="$RUNNER_TEMP/cowpaper-mounted"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          cleanup_mount() { hdiutil detach "$mount_dir" -quiet || true; }
          trap cleanup_mount EXIT
          test -d "$mount_dir/CowPaper.app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          test -f "$mount_dir/CowPaper.app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=4 "$mount_dir/CowPaper.app"
          dmg_cdhash="$(codesign -dv "$mount_dir/CowPaper.app" 2>&1 | awk -F= '/^CDHash=/{print $2}')"
          test "$dmg_cdhash" = "$app_cdhash"

          set +e
          spctl_output="$(spctl -a -vvv -t exec "$mount_dir/CowPaper.app" 2>&1)"
          spctl_status=$?
          set -e
          printf '%s\n' "$spctl_output"
          if printf '%s' "$spctl_output" | grep -Eiq 'code has no resources|not signed at all|invalid.*signature|damaged|malformed'; then
            echo "Gatekeeper reported a malformed or damaged signature" >&2
            exit 1
          fi
          if [[ "$spctl_status" -eq 0 ]]; then
            spctl_result=ACCEPTED
          else
            spctl_result=REJECTED_EXPECTED
          fi
          export SPCTL_RESULT="$spctl_result"

          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          version = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version']
          bundle = pathlib.Path('src-tauri/target/aarch64-apple-darwin/release/bundle')
          updaters = list(bundle.glob('macos/CowPaper*.app.tar.gz'))
          assert len(updaters) == 1, updaters
          updater = updaters[0]
          sources = [updater, pathlib.Path(str(updater) + '.sig'), bundle / f'dmg/CowPaper_{version}_aarch64.dmg']
          out = pathlib.Path('../release-assets/macos')
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for source in sources:
              assert source.is_file() and source.stat().st_size > 0, source
              target = out / source.name
              shutil.copyfile(source, target)
              records.append({'name': target.name, 'size': target.stat().st_size,
                              'sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
          assert len({item['name'] for item in records}) == 3
          (out / 'manifest.json').write_text(json.dumps({
              'platform': 'darwin-aarch64', 'sha': os.environ['GITHUB_SHA'],
              'version': version, 'files': records,
              'verification': {
                  'signatureType': 'AD-HOC',
                  'fullAdhocBundle': True,
                  'codeResources': 'PRESENT',
                  'codesignStrict': 'PASS',
                  'dmgAppStrict': 'PASS',
                  'updaterAppStrict': 'PASS',
                  'tauriUpdaterSignature': 'PASS',
                  'gatekeeperSpctl': os.environ['SPCTL_RESULT'],
              }}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: updater-macos-arm64
          path: release-assets/macos/
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build signed NSIS updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.windows.conf.json --target x86_64-pc-windows-msvc --bundles nsis
      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          version = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version']
          bundle = pathlib.Path('src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis')
          stem = f'CowPaper_{version}_x64-setup'
          sources = [bundle / (stem + ext) for ext in ('.exe', '.exe.sig')]
          assert {path.name for path in bundle.glob('CowPaper*')} == {path.name for path in sources}, 'Unexpected NSIS bundle files'
          out = pathlib.Path('../release-assets/windows')
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for source in sources:
              assert source.is_file() and source.stat().st_size > 0, source
              target = out / source.name
              shutil.copyfile(source, target)
              records.append({'name': target.name, 'size': target.stat().st_size,
                              'sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
          (out / 'manifest.json').write_text(json.dumps({
              'platform': 'windows-x86_64', 'sha': os.environ['GITHUB_SHA'],
              'version': version, 'files': records}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-x64
          path: release-assets/windows/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: updater-macos-arm64
          path: incoming/macos
      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-x64
          path: incoming/windows
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Validate both builds and generate latest.json
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish == true }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, shutil, subprocess, tempfile
          root = pathlib.Path.cwd()
          config = json.loads((root / 'app/src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          win_config = json.loads((root / 'app/src-tauri/tauri.windows.conf.json').read_text(encoding='utf-8'))
          version, sha = config['version'], os.environ['GITHUB_SHA']
          tag = 'v' + version
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?', version)
          assert config['bundle']['createUpdaterArtifacts'] is True
          assert win_config['bundle']['targets'] == ['nsis']
          assert os.environ['REF_TYPE'] != 'tag' or os.environ['REF_NAME'] == tag
          assert os.environ['PUBLISH'] != 'true' or os.environ['REF_TYPE'] == 'tag'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          if os.environ['REF_TYPE'] == 'tag':
              assert subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip() == sha

          assets = root / 'release-assets'
          assets.mkdir()
          seen, selected = set(), {}
          for folder, platform in (('macos', 'darwin-aarch64'), ('windows', 'windows-x86_64')):
              source = root / 'incoming' / folder
              manifest = json.loads((source / 'manifest.json').read_text())
              assert (manifest['platform'], manifest['sha'], manifest['version']) == (platform, sha, version)
              records = manifest['files']
              expected_count = 3 if folder == 'macos' else 2
              assert len(records) == expected_count
              names = {item['name'] for item in records}
              assert len(names) == expected_count and {p.name for p in source.iterdir()} == names | {'manifest.json'}
              for item in records:
                  name = item['name']
                  assert name == pathlib.Path(name).name and name not in seen
                  path = source / name
                  assert path.is_file() and path.stat().st_size == item['size'] and item['size'] > 0
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
                  shutil.copyfile(path, assets / name)
                  seen.add(name)
              if folder == 'macos':
                  verification = manifest.get('verification')
                  assert verification is not None
                  assert verification.get('signatureType') == 'AD-HOC'
                  assert verification.get('fullAdhocBundle') is True
                  assert verification.get('codeResources') == 'PRESENT'
                  assert verification.get('codesignStrict') == 'PASS'
                  assert verification.get('dmgAppStrict') == 'PASS'
                  assert verification.get('updaterAppStrict') == 'PASS'
                  assert verification.get('tauriUpdaterSignature') == 'PASS'
                  assert verification.get('gatekeeperSpctl') in {'ACCEPTED', 'REJECTED_EXPECTED'}
                  updater = [n for n in names if n.startswith('CowPaper') and n.endswith('.app.tar.gz')]
                  assert len(updater) == 1
                  assert names == {updater[0], updater[0] + '.sig', f'CowPaper_{version}_aarch64.dmg'}
              else:
                  updater = [n for n in names if n == f'CowPaper_{version}_x64-setup.exe']
                  assert len(updater) == 1
                  assert names == {updater[0], updater[0] + '.sig'}
              selected[platform] = updater[0]

          public_key = base64.b64decode(config['plugins']['updater']['pubkey'], validate=True)
          with tempfile.TemporaryDirectory() as tmp:
              key = pathlib.Path(tmp) / 'updater.pub'
              key.write_bytes(public_key)
              for updater in selected.values():
                  signature = (assets / (updater + '.sig')).read_text().strip()
                  assert signature
                  sig = pathlib.Path(tmp) / 'updater.minisig'
                  sig.write_bytes(base64.b64decode(signature, validate=True))
                  subprocess.run(['minisign', '-Vm', str(assets / updater), '-p', str(key), '-x', str(sig)], check=True)

          base_url = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{tag}/'
          metadata = {'version': version, 'platforms': {
              platform: {'url': base_url + updater,
                         'signature': (assets / (updater + '.sig')).read_text().strip()}
              for platform, updater in selected.items()}}
          # Tauri's updater schema exposes the Windows NSIS target under both
          # aliases.  Keep the payload and signature identical while emitting
          # both keys from the single aggregated manifest.
          metadata['platforms']['windows-x86_64-nsis'] = dict(
              metadata['platforms']['windows-x86_64'])
          assert set(metadata['platforms']) == {
              'darwin-aarch64', 'windows-x86_64', 'windows-x86_64-nsis'}
          (assets / 'latest.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TAG={tag}\n')
          print(f'Validated both platforms for {tag} at {sha}; publish={os.environ["PUBLISH"]}')
          PY
      - name: Save dry-run assets
        if: ${{ inputs.publish != true }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-release-dry-run
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Create one draft and upload all assets
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to alter it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "CowPaper $RELEASE_TAG" --notes-file docs/release-notes-v0.4.2.md
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
      - name: Verify uploaded bytes and publish
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          mkdir verified-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verified-download
          python3 - <<'PY'
          import hashlib, pathlib
          local, remote = pathlib.Path('release-assets'), pathlib.Path('verified-download')
          assert {p.name for p in local.iterdir()} == {p.name for p in remote.iterdir()}
          for source in local.iterdir():
              assert source.is_file()
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256((remote / source.name).read_bytes()).digest(), source.name
          print('Every draft asset matches its validated local copy.')
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
